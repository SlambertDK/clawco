# Clawco with Docker Compose (KC-0157). Notes: deploy/docker/README.md.
#   GIT_SHA=$(git rev-parse --short HEAD) docker compose up -d --build
#   → http://127.0.0.1:8750 on this machine only.
#   docker compose --profile tailscale up -d   → also https://<name>.<tailnet>.ts.net on your tailnet
# Invariant (Tailscale-only, never public): every published port names 127.0.0.1;
# test/docker-files.test.ts fails on anything else.
name: clawco

services:
  clawco:
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-}
    image: clawco:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:8750:8750"
    environment:
      # KC-0245: empty = start.sh picks: the built-in agent (Start asks for a key from a model provider, or a local
      # model; saved encrypted in the user folder, opened by the key on the clawco-noegle volume below), or Hermes
      # when this container already used it. Set KC_AGENT=direkte or hermes-http to choose yourself.
      KC_AGENT: ${KC_AGENT:-}
      # Advanced: your own Hermes (KC_AGENT=hermes-http). Paste its key in Start; it is saved in the user folder.
      KC_HERMES_URL: ${KC_HERMES_URL:-}
    volumes:
      - clawco-data:/data
      # KC-0245: the key file for the encrypted model keys, outside /data (a copy of the data volume never carries it).
      - clawco-noegle:/noegle
      # Optional (KC-0284): an existing Obsidian vault from the host (a NAS mount too) appears at /noter, where the notes
      # connector's "I already have an Obsidian vault" finds it: add -f compose.noter.yaml, no editing of this file.
    # Nothing but /data (and scratch in /tmp) is writable, so a new image never carries user data.
    # A local model on this machine (LM Studio, Ollama): in Start use http://host.docker.internal:1234 (or :11434).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    # KC-0276: the app runs as the node user, listens on 8750 and writes only /data, so it needs no capability at all.
    cap_drop:
      - ALL

  # Optional: the official Tailscale container serves Clawco on your tailnet over HTTPS.
  # The auth key is a Docker secret read from a file outside the repo (never in this file).
  tailscale:
    profiles: [tailscale]
    image: tailscale/tailscale:stable
    restart: unless-stopped
    # KC-0277 (review A13): Serve runs inside the app's network namespace and proxies to 127.0.0.1:8750, so the app
    # sees a loopback peer and honours Tailscale's identity headers (a household works; a tagged node is not the
    # owner). On the compose network the peer was the bridge and every identity header was dropped. `hostname:` is
    # not allowed with this mode; TS_HOSTNAME names the machine on the tailnet.
    network_mode: "service:clawco"
    # KC-0276: no new privileges. `cap_drop: [ALL]` is NOT set here on purpose: the container runs as root and reads
    # the key file with the host owner's mode 0600 (needs DAC_OVERRIDE), and kernel networking needs NET_ADMIN; the
    # default userspace mode needs neither, but nobody has tested the profile with every capability dropped.
    # Not read_only either: tailscaled writes its socket and state, and no tmpfs list for it has been tested.
    security_opt:
      - no-new-privileges:true
    environment:
      TS_AUTHKEY: file:/run/secrets/ts_authkey
      TS_AUTH_ONCE: "true"
      TS_HOSTNAME: ${CLAWCO_TS_NAVN:-clawco}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./deploy/docker/tailscale:/config:ro
    secrets:
      - ts_authkey
    depends_on:
      - clawco

volumes:
  clawco-data:
  clawco-noegle:
  tailscale-state:

secrets:
  ts_authkey:
    file: ${CLAWCO_TS_AUTHKEY_FIL:-${HOME}/.config/clawco/tailscale-authkey}
